[project]
name = "skillquery"
version = "0.1.0"
description = ""
authors = [
    {name = "Exenifix"}
]
license = {text = "MIT"}
requires-python = ">=3.11,<4.0"
dependencies = [
    "allianceauth>=4.7.0",
    "aa-memberaudit>=3.15.0",
]

[tool.poetry]
packages = [
    {include = "skillquery"}
]

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.11.13"
pre-commit = "^4.2.0"
djlint = "^1.36.4"

[tool.djlint]
profile = "django"

[tool.black]
line-length = 120
target-version = ["py313"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "migrations"
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "ASYNC",
    "C4",
    "PIE",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "RUF"
]
ignore = [
    "PIE796",
    "B028",
    "RUF018",
    "N818",
    "B905",
    "RUF012"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
